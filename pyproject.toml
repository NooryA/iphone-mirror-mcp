[project]
name = "iphone-mirror-mcp"
version = "0.1.0"
description = "MCP server that drives a physical iPhone through the macOS iPhone Mirroring window."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "NooryA" }]
dependencies = [
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
iphone-mirror-mcp = "iphone_mirror_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iphone_mirror_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
