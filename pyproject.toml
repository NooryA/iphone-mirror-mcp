[project]
name = "iphone-mirror-mcp"
version = "0.2.0"
description = "MCP server that drives a physical iPhone through the macOS iPhone Mirroring window."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "NooryA" }]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=2.0.0",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.0",
]

[project.scripts]
iphone-mirror-mcp = "iphone_mirror_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iphone_mirror_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"native/Sources" = "iphone_mirror_mcp/native/Sources"
"scripts/build-native.sh" = "iphone_mirror_mcp/native/build-native.sh"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.coverage",
    "/.pytest_cache",
    "/.venv",
    "/dist",
    "/htmlcov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.coverage.run]
source = ["iphone_mirror_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.0",
]
